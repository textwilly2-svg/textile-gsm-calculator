<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textile GSM Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        h2, h3 {
            text-align: center;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        hr {
            margin: 25px 0;
        }
    </style>
</head>

<body>

<h2>Textile GSM Calculator</h2>


<div class="box">

<h3>Fabric GSM Calculator</h3>

<label>Reed</label>
<input type="number" id="reed">

<label>Pick</label>
<input type="number" id="pick">

<label>Warp Count</label>
<input type="number" id="warp">

<label>Weft Count</label>
<input type="number" id="weft">


<button onclick="calculateGSM()">Calculate GSM</button>

<h3>Result</h3>

<p id="result"></p>

</div>


<div class="box">

<hr>

<h3>Yarn Count Converter</h3>

<label>Ne</label>
<input type="number" id="ne" placeholder="Enter Ne" oninput="convertCount()">

<label>Lea (from Ne)</label>
<input type="number" id="leaNe" readonly>


<label>Nm</label>
<input type="number" id="nm" placeholder="Enter Nm" oninput="convertCount()">

<label>Lea (from Nm)</label>
<input type="number" id="leaNm" readonly>

</div>


<script src="script.js"></script>

</body>
</html>
